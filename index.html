<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gra - Serpentyna i Motywy</title>
  <style>
    :root {
      --sky-top: #8ED0EE;
      --sky-bottom: #E8F7FF;
      --asphalt: #3A3F4B;
      --asphalt-light: #4B5160;
      --grass: #6FCF97;
      --sun: #FFC93C;
      --finish: #FF6B5B;
      --ink: #24303D;
      --paper: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: var(--ink);
      transition: background 0.5s ease;
    }

    /* Panel sterowania */
    .controls {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 15px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    .btn-action {
      background: var(--sun);
    }

    .info-panel {
      font-weight: bold;
      font-size: 1.1rem;
      margin: 0 10px;
    }

    /* Kontener planszy */
    .board-container {
      width: 100%;
      max-width: 650px;
      display: flex;
      justify-content: center;
    }

    .road-wrap.layout-grid {
      display: grid;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
      width: 100%;
    }

    /* Style pól trasy */
    .tile {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      position: relative;
      background-color: var(--asphalt);
      color: white;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .tile-done {
      background-color: var(--grass) !important;
    }

    .tile-start {
      background-color: var(--sun) !important;
      color: var(--ink);
    }

    .tile-finish {
      background-color: var(--finish) !important;
    }

    /* Zaokrąglony łącznik na zakręcie */
    .tile-connector {
      border-radius: 50%;
      background-color: var(--asphalt-light);
      transform: scale(0.9);
    }

    /* Pojazd / Postać na polu */
    .vehicle-marker {
      position: absolute;
      font-size: 1.8rem;
      z-index: 10;
      animation: bounce 0.4s ease infinite alternate;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }

    /* Elementy dekoracyjne w miejscach odstępu */
    .decor-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      pointer-events: none;
      user-select: none;
    }

    /* Animacje ikonek w tle */
    @keyframes sway {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); }
      50% { transform: scale(1.1); }
    }

    .anim-sway { display: inline-block; animation: sway 3s ease-in-out infinite; }
    .anim-bob  { display: inline-block; animation: bob 2.2s ease-in-out infinite; }
    .anim-pulse{ display: inline-block; animation: pulse 2.5s ease-in-out infinite; }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="switchTheme('road')">Motyw: Droga 🚗</button>
    <button class="btn" onclick="switchTheme('forest')">Motyw: Las 🦊</button>
    <div class="info-panel">Pole: <span id="posDisplay">1</span> / <span id="totalDisplay">20</span></div>
    <button class="btn btn-action" onclick="moveVehicle(1)">Zrób krok 🎲</button>
    <button class="btn" onclick="resetGame()">Reset 🔄</button>
  </div>

  <div class="board-container">
    <div id="roadWrap" class="road-wrap layout-grid"></div>
  </div>

  <script>
    // Konfiguracja motywów
    const THEME_STYLE = {
      road: {
        emoji: '🚦', layout: 'grid', gridAspectBias: 1,
        bgTop: '#8ED0EE', bgBottom: '#E8F7FF', trackBg: '#3A3F4B', trackBgLight: '#4B5160',
        tileDone: '#6FCF97', startColor: '#FFC93C', finishColor: '#FF6B5B',
        vehicle: '🚗', startIcon: '🚦', finishIcon: '🏁',
        decor: [
          { e: '🌳', a: 'sway' },
          { e: '🌿', a: 'pulse' },
          { e: '☁️', a: 'bob' },
          { e: '🐦', a: 'bob' },
          { e: '🪨', a: 'none' }
        ]
      },
      forest: {
        emoji: '🌲', layout: 'grid', gridAspectBias: 0.8,
        bgTop: '#BFE6C4', bgBottom: '#EAF7EA', trackBg: '#5B4632', trackBgLight: '#6E5940',
        tileDone: '#8BC34A', startColor: '#FFD54F', finishColor: '#795548',
        vehicle: '🦊', startIcon: '🌳', finishIcon: '🏕️',
        decor: [
          { e: '🌲', a: 'sway' },
          { e: '🍄', a: 'pulse' },
          { e: '🦋', a: 'bob' },
          { e: '🍃', a: 'sway' },
          { e: '🌸', a: 'pulse' }
        ]
      }
    };

    let currentThemeKey = 'road';
    let TOTAL_TILES = 18;
    let currentPosition = 0; // Indeks od 0 do TOTAL_TILES - 1
    let pathElements = [];

    // Aplikowanie zmiennych kolorów CSS
    function applyThemeVars(theme) {
      const root = document.documentElement.style;
      root.setProperty('--sky-top', theme.bgTop);
      root.setProperty('--sky-bottom', theme.bgBottom);
      root.setProperty('--asphalt', theme.trackBg);
      root.setProperty('--asphalt-light', theme.trackBgLight);
      root.setProperty('--grass', theme.tileDone);
      root.setProperty('--sun', theme.startColor);
      root.setProperty('--finish', theme.finishColor);
    }

    // Tworzenie pojedynczego pola trasy
    function createTileElement(index, theme, count, isConnector = false) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      
      if (index === 0) {
        tile.classList.add('tile-start');
        tile.innerHTML = `<span>${theme.startIcon}</span>`;
      } else if (index === count - 1) {
        tile.classList.add('tile-finish');
        tile.innerHTML = `<span>${theme.finishIcon}</span>`;
      } else {
        tile.innerText = index + 1;
      }

      return tile;
    }

    // Generator siatki wężowej z wierszami odstępu i łącznikami
    function buildGridTiles(wrap, theme, count) {
      wrap.innerHTML = '';
      pathElements = [];
      
      const cols = Math.max(3, Math.round(Math.sqrt(count * (theme.gridAspectBias || 1))));
      wrap.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      let gridRow = 1;
      let gridCol = 1;
      let dir = 1; // 1 = prawo, -1 = lewo

      const occupied = {};
      let tileIndex = 0;

      while (tileIndex < count) {
        // 1. Zwykłe pole trasy
        const tile = createTileElement(tileIndex, theme, count);
        tile.style.gridRow = gridRow;
        tile.style.gridColumn = gridCol;
        wrap.appendChild(tile);
        
        pathElements.push(tile);
        occupied[`${gridRow}-${gridCol}`] = true;
        tileIndex++;

        if (tileIndex >= count) break;

        // 2. Obsługa końca wiersza i zakrętu
        const atRightEdge = (dir === 1 && gridCol === cols);
        const atLeftEdge = (dir === -1 && gridCol === 1);

        if (atRightEdge || atLeftEdge) {
          // Przejście do wiersza odstępu
          gridRow += 1;

          // Pole-łącznik na zakręcie
          const connectorTile = createTileElement(tileIndex, theme, count, true);
          connectorTile.style.gridRow = gridRow;
          connectorTile.style.gridColumn = gridCol;
          connectorTile.classList.add('tile-connector');
          wrap.appendChild(connectorTile);

          pathElements.push(connectorTile);
          occupied[`${gridRow}-${gridCol}`] = true;
          tileIndex++;

          // Zmiana wiersza na kolejny główny i zmiana kierunku
          gridRow += 1;
          dir = -dir;
        } else {
          gridCol += dir;
        }
      }

      // 3. Wypełnianie puste miejsc w odstępach animowanymi dekoracjami
      const totalGridRows = gridRow;
      for (let r = 1; r <= totalGridRows; r++) {
        if (r % 2 === 0) { // Tylko wiersze odstępu
          for (let c = 1; c <= cols; c++) {
            if (!occupied[`${r}-${c}`]) {
              const decorCell = document.createElement('div');
              decorCell.className = 'decor-cell';
              decorCell.style.gridRow = r;
              decorCell.style.gridColumn = c;

              const decorList = theme.decor || [];
              if (decorList.length > 0) {
                const item = decorList[Math.floor(Math.random() * decorList.length)];
                if (item.a !== 'none') {
                  decorCell.innerHTML = `<span class="decor-icon anim-${item.a}">${item.e}</span>`;
                } else {
                  decorCell.innerHTML = `<span class="decor-icon">${item.e}</span>`;
                }
              }
              wrap.appendChild(decorCell);
            }
          }
        }
      }

      updateVehiclePosition();
    }

    // Aktualizacja pozycji pojazdu i stanów pól
    function updateVehiclePosition() {
      const theme = THEME_STYLE[currentThemeKey];

      pathElements.forEach((el, idx) => {
        // Czyszczenie poprzednich znaczników pojazdu
        const existingVehicle = el.querySelector('.vehicle-marker');
        if (existingVehicle) existingVehicle.remove();

        // Oznaczanie zaliczonych pól
        if (idx < currentPosition) {
          el.classList.add('tile-done');
        } else {
          el.classList.remove('tile-done');
        }

        // Rysowanie pojazdu na aktualnym polu
        if (idx === currentPosition) {
          const vehicleEl = document.createElement('div');
          vehicleEl.className = 'vehicle-marker';
          vehicleEl.innerText = theme.vehicle;
          el.appendChild(vehicleEl);
        }
      });

      document.getElementById('posDisplay').innerText = currentPosition + 1;
      document.getElementById('totalDisplay').innerText = pathElements.length;
    }

    // Ruch pojazdu
    function moveVehicle(steps) {
      if (currentPosition + steps < pathElements.length) {
        currentPosition += steps;
      } else {
        currentPosition = pathElements.length - 1; // Osiągnięto metę
      }
      updateVehiclePosition();
    }

    // Reset gry
    function resetGame() {
      currentPosition = 0;
      updateVehiclePosition();
    }

    // Zmiana motywów
    function switchTheme(themeKey) {
      currentThemeKey = themeKey;
      const theme = THEME_STYLE[themeKey];
      applyThemeVars(theme);
      buildGridTiles(document.getElementById('roadWrap'), theme, TOTAL_TILES);
    }

    // Inicjalizacja po załadowaniu
    window.addEventListener('DOMContentLoaded', () => {
      switchTheme('road');
    });
  </script>
</body>
</html>
