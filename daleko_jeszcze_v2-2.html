};

function haversine(lat1,lon1,lat2,lon2){const R=6371,toRad=d=>d*Math.PI/180,dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ---------- API LAYER ----------
   Production mode: set API_BASE_URL to your backend.
   Expected endpoints:
   GET  /api/geocode?q=...&lang=...
   POST /api/route  body: {start:{lat,lng},destination:{lat,lng}}
   The local fallback exists only for testing.
*/
async function apiFetch(path,options={}){
  if(!API_BASE_URL) throw new Error('BACKEND_NOT_CONFIGURED');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),options.timeout||15000);
  try{
    const res=await fetch(API_BASE_URL.replace(/\/$/,'')+path,{...options,signal:controller.signal,headers:{'Accept':'application/json',...(options.headers||{})}});
    if(!res.ok) throw new Error('API HTTP '+res.status);
    return await res.json();
  }finally{clearTimeout(timer)}
}

async function geocodeNominatim(query){
  const url='https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=5&accept-language='+settings.lang+'&q='+encodeURIComponent(query);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('Nominatim HTTP '+res.status);
  const data=await res.json();
  return data.map(r=>({lat:r.lat,lon:r.lon,shortName:r.display_name.split(',')[0],fullName:r.display_name}));
}
async function geocodePhoton(query){
  const url='https://photon.komoot.io/api/?limit=5&lang='+settings.lang+'&q='+encodeURIComponent(query);
  const res=await fetch(url);
  if(!res.ok)throw new Error('Photon HTTP '+res.status);
  const data=await res.json();
  return(data.features||[]).map(f=>{const p=f.properties,parts=[p.name,p.street,p.city,p.state,p.country].filter(Boolean);return{lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0],shortName:p.name||p.city||query,fullName:parts.join(', ')}})
}
async function geocodeAddress(query){
  if(API_BASE_URL){
    const data=await apiFetch('/api/geocode?q='+encodeURIComponent(query)+'&lang='+encodeURIComponent(settings.lang));
    return Array.isArray(data)?data:(data.results||[]);
  }
  try{const r=await geocodeNominatim(query);if(r.length)return r;throw new Error('no Nominatim results')}
  catch(a){return await geocodePhoton(query)}
}
async function fetchRoute(sLat,sLng,dLat,dLng){
  if(API_BASE_URL){
    const data=await apiFetch('/api/route',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:{lat:sLat,lng:sLng},destination:{lat:dLat,lng:dLng}}),timeout:20000});
    const points=(data.points||data.route||[]).map(p=>Array.isArray(p)?[Number(p[0]),Number(p[1])]:[Number(p.lat),Number(p.lng)]);
    if(points.length<2)throw new Error('invalid backend route');
    const cum=buildCumulativeDistances(points);
    return{points,cum,totalKm:Number(data.totalKm||data.distanceKm||cum[cum.length-1])};
  }
  const url=`https://router.project-osrm.org/route/v1/driving/${sLng},${sLat};${dLng},${dLat}?overview=full&geometries=geojson`;
  const res=await fetch(url);
  if(!res.ok)throw new Error('OSRM HTTP '+res.status);
  const data=await res.json();
  if(!data.routes||!data.routes.length)throw new Error('no road route');
  const route=data.routes[0],points=route.geometry.coordinates.map(c=>[c[1],c[0]]),cum=buildCumulativeDistances(points);
  return{points,cum,totalKm:route.distance/1000}
}
function buildCumulativeDistances(points){
  const cum=[0];
  for(let i=1;i<points.length;i++)cum.push(cum[i-1]+haversine(points[i-1][0],points[i-1][1],points[i][0],points[i][1]));
  return cum;
}

/* ---------- ROBUST GPS / ROUTE MATCHING ----------
   Instead of selecting the nearest route point, project GPS onto nearby
   route segments. Search is local first, with a wider fallback.
*/
function projectPointToSegment(lat,lng,a,b){
  const lat0=(lat+a[0]+b[0])/3*Math.PI/180;
  const kLat=111.32;
  const kLng=111.32*Math.cos(lat0);
  const px=(lng-a[1])*kLng,py=(lat-a[0])*kLat;
  const bx=(b[1]-a[1])*kLng,by=(b[0]-a[0])*kLat;
  const len2=bx*bx+by*by;
  let t=0;if(len2>1e-12)t=clamp((px*bx+py*by)/len2,0,1);
  const qx=bx*t,qy=by*t;
  const dx=px-qx,dy=py-qy;
  return{t,distanceKm:Math.sqrt(dx*dx+dy*dy)/1000,alongKm:haversine(a[0],a[1],b[0],b[1])*t}
}
function buildSegmentMeta(){
  routeMeta.segments=[];
  if(!routePoints||routePoints.length<2)return;
  for(let i=0;i<routePoints.length-1;i++){
    const a=routePoints[i],b=routePoints[i+1];
    const dx=b[1]-a[1],dy=b[0]-a[0];
    routeMeta.segments.push({i,a,b,lengthKm:haversine(a[0],a[1],b[0],b[1]),heading:Math.atan2(dx,dy)*180/Math.PI});
  }
}
function bearing(lat1,lng1,lat2,lng2){
  const p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dl=(lng2-lng1)*Math.PI/180;
  return(Math.atan2(Math.sin(dl)*Math.cos(p2),Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl))*180/Math.PI+360)%360
}
function angleDiff(a,b){return Math.abs((a-b+540)%360-180)}
function projectGpsToRoute(lat,lng,accuracy=30){
  if(!routePoints||routePoints.length<2)return null;
  const start=Math.max(0,gpsState.lastAcceptedIndex-20);
  const end=Math.min(routeMeta.segments.length-1,gpsState.lastAcceptedIndex+100);
  let best=null;
  const testRange=(from,to)=>{
    for(let i=from;i<=to;i++){
      const s=routeMeta.segments[i],p=projectPointToSegment(lat,lng,s.a,s.b);
      const along=routeCumDist[i]+p.alongKm;
      let score=p.distanceKm;
      if(gpsState.lastPosition&&gpsState.lastTimestamp){
        const dt=Math.max(.5,(performance.now()-gpsState.lastTimestamp)/1000);
        const move=haversine(gpsState.lastPosition.lat,gpsState.lastPosition.lng,lat,lng);
        const gpsBearing=bearing(gpsState.lastPosition.lat,gpsState.lastPosition.lng,lat,lng);
        const hd=angleDiff(gpsBearing,s.heading);
        if(move>.02&&hd>100)score+=Math.min(.15,p.distanceKm+.05);
      }
      if(!best||score<best.score)best={index:i,alongKm:along,distanceKm:p.distanceKm,t:p.t,score}
    }
  };
  testRange(start,end);
  if(!best||best.distanceKm>Math.max(.08,accuracy/1000*3)){
    testRange(0,routeMeta.segments.length-1);
  }
  return best;
}
function acceptProgressFromGps(pos){
  const {latitude:lat,longitude:lng,accuracy=30}=pos.coords;
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
  const match=usingRoute?projectGpsToRoute(lat,lng,accuracy):null;
  let fraction;
  let matchedIndex=0;
  if(usingRoute&&match){
    fraction=match.alongKm/totalDistance;
    matchedIndex=match.index;
    if(match.distanceKm>Math.max(.12,(accuracy||30)/1000*4)){
      $('boardStatus').textContent=t('gpsWeak');
      return;
    }
  }else{
    const remaining=haversine(lat,lng,destLat,destLng);
    fraction=(totalDistance-remaining)/totalDistance;
  }
  fraction=clamp(fraction,0,1);

  const jump=fraction-gpsState.lastAcceptedProgress;
  const now=performance.now();
  const previous=gpsState.lastPosition;
  const elapsed=Math.max(.5,(now-gpsState.lastTimestamp)/1000);
  const physicalMove=previous?haversine(previous.lat,previous.lng,lat,lng):0;
  const maxReasonableJump=Math.max(.025,Math.min(.12,(physicalMove+Math.max(accuracy,30)/1000*2)/Math.max(1,elapsed*2)));

  if(jump>maxReasonableJump && gpsState.lastAcceptedProgress<.95){
    if(gpsState.pendingJump&&Math.abs(gpsState.pendingJump.fraction-fraction)<.04){
      gpsState.pendingJump=null;
    }else{
      gpsState.pendingJump={fraction,index:matchedIndex,at:now};
      $('boardStatus').textContent=t('gpsWeak');
      return;
    }
  }
  if(fraction>=gpsState.lastAcceptedProgress){
    maxProgress=Math.max(maxProgress,fraction);
    gpsState.lastAcceptedProgress=maxProgress;
    gpsState.lastAcceptedIndex=Math.max(gpsState.lastAcceptedIndex,matchedIndex);
    gpsState.lastPosition={lat,lng};
    gpsState.lastTimestamp=now;
    renderProgress(maxProgress);
    $('boardStatus').textContent='';
  }
}
function handlePosition(pos){acceptProgressFromGps(pos)}
function handlePositionError(err){$('boardStatus').textContent=t('errGps')+' '+err.message;$('boardStatus').classList.add('error')}
function startTracking(){
  if(!navigator.geolocation){$('boardStatus').textContent=t('errNoGeoSupport');return}
  watchId=navigator.geolocation.watchPosition(handlePosition,handlePositionError,{enableHighAccuracy:true,maximumAge:3000,timeout:15000})
}
function stopTracking(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}}

/* ---------- BOARD ---------- */
function applyThemeVars(theme){const root=document.documentElement.style;root.setProperty('--sky-top',theme.bgTop);root.setProperty('--sky-bottom',theme.bgBottom);root.setProperty('--asphalt',theme.trackBg);root.setProperty('--asphalt-light',theme.trackBgLight);root.setProperty('--grass',theme.tileDone);root.setProperty('--sun',theme.startColor);root.setProperty('--finish',theme.finishColor)}
function buildGridTiles(wrap,theme,count){
  wrap.className='road-wrap layout-grid';wrap.style.display='grid';
  const W=wrap.clientWidth,H=wrap.clientHeight,aspect=(W/Math.max(H,1))*(theme.gridAspectBias||1);
  let cols=Math.max(3,Math.round(Math.sqrt(count*aspect)));cols=Math.min(cols,count);
  const rows=Math.ceil(count/cols),gap=count>300?1:count>120?2:4;
  wrap.style.gap=gap+'px';wrap.style.gridTemplateColumns=`repeat(${cols},1fr)`;wrap.style.gridTemplateRows=`repeat(${rows},1fr)`;
  for(let i=0;i<count;i++){const row=Math.floor(i/cols),ci=i%cols,col=row%2===1?cols-1-ci:ci,e=document.createElement('div');e.className='tile';e.id='tile-'+(i+1);e.style.gridColumn=col+1;e.style.gridRow=row+1;if(i===0)e.classList.add('start');if(i===count-1)e.classList.add('finish');wrap.appendChild(e)}
}
function buildPathTiles(wrap,theme,count){
  wrap.className='road-wrap layout-path';wrap.style.display='block';
  const W=wrap.clientWidth,H=wrap.clientHeight,size=Math.max(5,Math.min(30,Math.floor(Math.min(W/8,H/(count/6||1))))),usableH=Math.max(1,H-size),usableW=Math.max(1,W-size),ampScale=.42;
  for(let i=0;i<count;i++){const frac=count>1?i/(count-1):0,topPx=frac*usableH,xFrac=theme.layout==='wave'?.5+Math.sin(i*.5)*ampScale:.5+(i%2===0?-1:1)*ampScale*(.75+.25*Math.sin(i*.12)),leftPx=xFrac*usableW,e=document.createElement('div');e.className='tile-path';e.id='tile-'+(i+1);e.style.width=size+'px';e.style.height=size+'px';e.style.left=leftPx+'px';e.style.top=topPx+'px';if(i===0)e.classList.add('start');if(i===count-1)e.classList.add('finish');wrap.appendChild(e)}
}
function buildDecor(theme){const layer=$('boardDecor');layer.innerHTML='';const positions=[{top:'6%',left:'6%'},{top:'10%',right:'8%'},{bottom:'14%',left:'10%'},{bottom:'8%',right:'6%'}];theme.decor.forEach((d,i)=>{const e=document.createElement('span');e.className='d '+d.a;e.textContent=d.e;e.style.fontSize=(22+(i%2)*6)+'px';e.style.opacity='.5';Object.entries(positions[i%positions.length]).forEach(([k,v])=>e.style[k]=v);e.style.animationDuration=3+i*.8+'s';e.style.animationDelay=i*.4+'s';layer.appendChild(e)})}
function buildBoard(){const theme=activeThemeInfo();applyThemeVars(theme);buildDecor(theme);const wrap=$('roadWrap');wrap.innerHTML='';theme.layout==='grid'?buildGridTiles(wrap,theme,settings.tileCount):buildPathTiles(wrap,theme,settings.tileCount)}
window.addEventListener('resize',()=>{if($('boardScreen').classList.contains('hidden'))return;clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{buildBoard();renderProgress(maxProgress)},200)})
function renderProgress(fraction){
  fraction=clamp(fraction,0,1);const theme=activeThemeInfo(),count=settings.tileCount,filled=Math.floor(fraction*count),current=Math.min(count,filled+1),carSize=Math.max(9,Math.min(16,Math.floor(160/Math.sqrt(count))));
  for(let i=1;i<=count;i++){const e=$('tile-'+i);if(!e)continue;e.classList.remove('current');e.querySelector('.car')?.remove();i<=filled?e.classList.add('done'):e.classList.remove('done')}
  if(fraction<1){const e=$('tile-'+current);if(e){e.classList.add('current');const car=document.createElement('span');car.className='car';car.style.fontSize=carSize+'px';car.textContent=theme.vehicle;e.appendChild(car)}}
  $('progressFill').style.width=fraction*100+'%';$('statPercent').textContent=Math.round(fraction*100)+'%';
  const remaining=totalDistance*(1-fraction);$('statKm').textContent=remaining<10?remaining.toFixed(1):Math.round(remaining);
  const msg=$('progressMsg');if(fraction>=1)msg.textContent=t('msgDone')+(destName?' '+t('msgDoneTo')+' '+destName:'')+'!';else if(fraction>=.9)msg.textContent=t('msgAlmost')+' '+theme.finishIcon;else if(fraction>=.5)msg.textContent=t('msgHalf');else if(fraction>=.1)msg.textContent=t('msgGo')+' '+theme.vehicle;else msg.textContent=t('msgStart')+' '+theme.startIcon;
}

/* ---------- SAFE GEOCODING RESULTS ---------- */
function renderResults(results){
  const list=$('resultsList');list.innerHTML='';
  if(!results.length){list.classList.add('hidden');$('setupStatus').textContent=t('errNoResults');$('setupStatus').classList.add('error');return}
  results.forEach(r=>{
    const btn=document.createElement('button');btn.className='result-item';
    const b=document.createElement('b');b.textContent=r.shortName||r.name||'';
    const text=document.createTextNode(r.fullName||r.display_name||'');
    btn.appendChild(b);btn.appendChild(text);btn.addEventListener('click',()=>selectDestination(r));list.appendChild(btn)
  });list.classList.remove('hidden')
}
function selectDestination(r){
  destLat=parseFloat(r.lat);destLng=parseFloat(r.lon);destName=r.shortName||r.name||r.fullName||'';
  $('resultsList').classList.add('hidden');$('resultsList').innerHTML='';$('destAddress').value='';
  $('destChipName').textContent=destName;$('destChipAddr').textContent=r.fullName||r.display_name||'';
  $('destChip').classList.remove('hidden');$('startBtn').disabled=false;$('setupStatus').textContent='';$('setupStatus').classList.remove('error')
}
$('destClearBtn').addEventListener('click',()=>{destLat=destLng=destName=undefined;$('destChip').classList.add('hidden');$('startBtn').disabled=true})
$('searchBtn').addEventListener('click',async()=>{
  const q=$('destAddress').value.trim(),s=$('setupStatus');s.classList.remove('error');if(!q){s.textContent=t('errFillDest');s.classList.add('error');return}
  $('searchBtn').disabled=true;s.textContent=t('searching');
  try{renderResults(await geocodeAddress(q));s.textContent=''}catch(e){s.textContent=t('errSearchFail')+'. '+t('errCheckNet');s.classList.add('error')}finally{$('searchBtn').disabled=false}
});
$('destAddress').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('searchBtn').click()}});

/* ---------- START / RESET ---------- */
$('startBtn').addEventListener('click',()=>{
  const s=$('setupStatus');s.classList.remove('error');
  if(destLat===undefined||destLng===undefined){s.textContent=t('errPickDest');s.classList.add('error');return}
  if(!navigator.geolocation){s.textContent=t('errNoGeoSupport');s.classList.add('error');return}
  s.textContent=t('statusLocating');
  navigator.geolocation.getCurrentPosition(async pos=>{
    startLat=pos.coords.latitude;startLng=pos.coords.longitude;routePoints=null;routeCumDist=null;usingRoute=false;routeMeta.segments=null;
    gpsState={lastAcceptedIndex:0,lastAcceptedProgress:0,lastPosition:null,lastTimestamp:0,pendingJump:null};
    if(settings.forceStraightLine){totalDistance=haversine(startLat,startLng,destLat,destLng)}
    else{ s.textContent=t('statusRouting');try{const route=await fetchRoute(startLat,startLng,destLat,destLng);routePoints=route.points;routeCumDist=route.cum;totalDistance=route.totalKm;usingRoute=true;buildSegmentMeta()}catch(e){totalDistance=haversine(startLat,startLng,destLat,destLng);usingRoute=false}}
    if(totalDistance<.05){s.textContent=t('errAlreadyThere');s.classList.add('error');return}
    maxProgress=0;$('setupScreen').classList.add('hidden');$('boardScreen').classList.remove('hidden');buildBoard();renderProgress(0);
    const icon=$('routeModeIcon');if(settings.forceStraightLine||!usingRoute){icon.textContent='📏';icon.title=t('routeModeStraightTitle')}else{icon.textContent='〰️';icon.title=t('routeModeRouteTitle')}
    startTracking();
  },err=>{s.textContent=t('errGps')+' '+err.message+'. '+t('errGpsCheck');s.classList.add('error')},{enableHighAccuracy:true,timeout:15000,maximumAge:0})
});
$('resetBtn').addEventListener('click',()=>{stopTracking();destLat=destLng=destName=undefined;routePoints=null;routeCumDist=null;usingRoute=false;routeMeta.segments=null;$('destChip').classList.add('hidden');$('destAddress').value='';$('resultsList').classList.add('hidden');$('resultsList').innerHTML='';$('startBtn').disabled=true;$('boardScreen').classList.add('hidden');$('setupScreen').classList.remove('hidden');$('setupStatus').textContent='';$('boardStatus').textContent=''});

/* ---------- OPTIONS ---------- */
function updateThemePreview(){const th=activeThemeInfo();$('themePreviewEmoji').textContent=th.emoji;let txt=t('themePrefix')+' '+th.label+' · '+settings.tileCount+' '+t('tilesSuffix');if(settings.forceStraightLine)txt+=' · '+t('straightSuffix');$('themePreviewText').textContent=txt}
function renderThemeGrid(){const grid=$('themeGrid');grid.innerHTML='';Object.keys(THEME_STYLE).forEach(key=>{const th=themeInfo(key),card=document.createElement('div');card.className='theme-card'+(settings.theme===key?' selected':'');const em=document.createElement('span');em.className='em';em.textContent=th.emoji;const lb=document.createElement('span');lb.className='lb';lb.textContent=th.label;const sh=document.createElement('span');sh.className='shape';sh.textContent=th.shape;card.append(em,lb,sh);card.addEventListener('click',()=>{settings.theme=key;renderThemeGrid();updateThemePreview()});grid.appendChild(card)})}
function applyStaticTexts(){
  $('badgeText').textContent=t('badge');$('titleText').innerHTML=t('titleHtml');$('subtitleText').textContent=t('subtitle');$('themePreviewEdit').textContent=t('change');$('destCardTitle').textContent=t('destCardTitle');$('destCardHint').textContent=t('destCardHint');$('destAddressLabel').textContent=t('destAddressLabel');$('destAddress').placeholder=t('destAddressPlaceholder');$('searchBtn').textContent=t('searchBtn');$('destClearBtn').textContent=t('change');$('startBtn').textContent=t('startBtn');$('setupFooterNote').textContent=t('setupFooterNote');$('optionsTitle').textContent=t('optionsTitle');$('langCardTitle').textContent=t('langCardTitle');$('langBtnPl').textContent=t('langPl');$('langBtnEn').textContent=t('langEn');$('themeCardTitle').textContent=t('themeCardTitle');$('themeCardHint').textContent=t('themeCardHint');$('tileCardTitle').textContent=t('tileCardTitle');$('tileCardHint').textContent=t('tileCardHint');$('tileCountHint2').textContent=t('tileCountHint2');$('straightLineLabel').textContent=t('straightLineLabel');$('straightLineSub').textContent=t('straightLineSub');$('optionsDoneBtn').textContent=t('optionsDoneBtn');$('statPercentLbl').textContent=t('statPercentLbl');$('statKmLbl').textContent=t('statKmLbl');$('resetBtn').textContent=t('resetBtn');$('langQuickBtn').textContent=settings.lang.toUpperCase();$('langBtnPl').classList.toggle('selected',settings.lang==='pl');$('langBtnEn').classList.toggle('selected',settings.lang==='en');renderThemeGrid();updateThemePreview()
}
function setLang(lang){settings.lang=lang;document.documentElement.lang=lang;applyStaticTexts()}
function openOptions(){$('setupScreen').classList.add('hidden');$('optionsScreen').classList.remove('hidden');renderThemeGrid();$('tileCountRange').value=settings.tileCount;$('tileCountNum').value=settings.tileCount;$('forceStraightToggle').checked=settings.forceStraightLine}
function closeOptions(){$('optionsScreen').classList.add('hidden');$('setupScreen').classList.remove('hidden');updateThemePreview()}
$('gearBtn').addEventListener('click',openOptions);$('themePreviewEdit').addEventListener('click',openOptions);$('optionsBackBtn').addEventListener('click',closeOptions);$('optionsDoneBtn').addEventListener('click',closeOptions);$('langQuickBtn').addEventListener('click',()=>setLang(settings.lang==='pl'?'en':'pl'));$('langBtnPl').addEventListener('click',()=>setLang('pl'));$('langBtnEn').addEventListener('click',()=>setLang('en'));
$('tileCountRange').addEventListener('input',()=>{settings.tileCount=parseInt($('tileCountRange').value,10);$('tileCountNum').value=settings.tileCount;updateThemePreview()});
$('tileCountNum').addEventListener('change',()=>{let v=parseInt($('tileCountNum').value,10);if(isNaN(v))v=100;v=Math.max(10,Math.min(1000,v));settings.tileCount=v;$('tileCountNum').value=v;$('tileCountRange').value=v;updateThemePreview()});
$('forceStraightToggle').addEventListener('change',()=>{settings.forceStraightLine=$('forceStraightToggle').checked;updateThemePreview()});

applyStaticTexts();
</script>
